controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1

      vx_max: 0.5
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 0.8

      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 2.0

      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"

      visualize: True
      publish_optimal_trajectory: True

      critics:
        - "ConstraintCritic"
        - "ObstaclesCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic:
        enabled: True
        cost_weight: 4.0
        cost_power: 1

      ObstaclesCritic:
        enabled: True
        cost_power: 1
        cost_weight: 8.0
        critical_weight: 1000.0
        consider_footprint: True
        collision_cost: 1000000.0
        collision_margin_distance: 0.15
        near_goal_distance: 0.5
        inflation_layer_name: "inflation_layer"

      GoalCritic:
        enabled: True
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: True
        cost_weight: 3.0
        cost_power: 1
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: True
        cost_weight: 3.0
        cost_power: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        trajectory_point_step: 4

      PathFollowCritic:
        enabled: True
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 1.4
        offset_from_furthest: 5

      PathAngleCritic:
        enabled: True
        cost_weight: 2.0
        cost_power: 1
        threshold_to_consider: 0.5
        offset_from_furthest: 4
        max_angle_to_furthest: 1.0
        forward_preference: True

      PreferForwardCritic:
        enabled: True
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 0.5


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: True
      width: 10
      height: 10
      resolution: 0.05

      footprint: "[[0.71, 0.70], [0.71, -0.70], [-0.71, -0.70], [-0.71, 0.70]]"
      footprint_padding: 0.03

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: lidar

        lidar:
          topic: /lidar/scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          obstacle_min_range: 0.2
          obstacle_max_range: 10.0
          raytrace_min_range: 0.2
          raytrace_max_range: 12.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.15

      always_send_full_costmap: True


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05

      footprint: "[[0.71, 0.70], [0.71, -0.70], [-0.71, -0.70], [-0.71, 0.70]]"
      footprint_padding: 0.03

      track_unknown_space: True
      rolling_window: True
      width: 30
      height: 30

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: lidar

        lidar:
          topic: /lidar/scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          inf_is_valid: True
          obstacle_min_range: 0.2
          obstacle_max_range: 10.0
          raytrace_min_range: 0.2
          raytrace_max_range: 12.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.15
